apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-logging
  namespace: kube-system
  labels:
    app: vector-logging
spec:
  selector:
    matchLabels:
      app: vector-logging
  template:
    metadata:
      labels:
        app: vector-logging
    spec:
      serviceAccountName: vector-logging
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.38.0-debian
          args: ["--config", "/etc/vector/vector.yaml", "--quiet"]
          env:
            - name: VECTOR_LOG
              value: info
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/vector
              name: vector-config
              readOnly: true
            - mountPath: /var/log/pods
              name: varlogpods
              readOnly: true
            - mountPath: /var/log/containers
              name: varlogcontainers
              readOnly: true
            - mountPath: /var/lib/vector
              name: data
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/log/journal
              name: journal
              readOnly: true
            - mountPath: /run/systemd/journal
              name: journalrun
              readOnly: true
            - mountPath: /etc/machine-id
              name: machineid
              readOnly: true
      volumes:
        - name: vector-config
          configMap:
            name: vector-logging-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
        - name: journal
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: journalrun
          hostPath:
            path: /run/systemd/journal
            type: Directory
        - name: machineid
          hostPath:
            path: /etc/machine-id
            type: File
