apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: company-prod-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://gitlab.example.com/company/argo-cd
        revision: develop
        directories:
          - path: "company-helm-chart/values/company-prod/*"
  template:
    metadata:
      name: "{{ .path.basename }}-prod"
    spec:
      project: default
      source:
        repoURL: https://gitlab.example.com/company/argo-cd
        targetRevision: develop
        path: company-helm-chart
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "values/{{ index .path.segments 2 }}/{{ .path.basename }}/values.yaml"
      destination:
        name: k8s-prod
        namespace: "{{ index .path.segments 2 }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
