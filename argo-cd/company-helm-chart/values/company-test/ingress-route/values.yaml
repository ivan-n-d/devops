skipDefaultResources: true

ingressRoute:
  enabled: true
  name: company-test-route
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`test.company-k8s.local`) && PathPrefix(`/api/swagger`)
      services:
        - name: gateway
          port: 8080
    - kind: Rule
      match: Host(`test.company-k8s.local`)
      services:
        - name: frontend-application
          port: 80
    - kind: Rule
      match: Host(`facade.test.company-k8s.local`)
      services:
        - name: facade
          port: 8080
    - kind: Rule
      match: Host(`filemanager.test.company-k8s.local`)
      services:
        - name: filemanager
          port: 8080
    - kind: Rule
      match: Host(`gitmanager.test.company-k8s.local`)
      services:
        - name: gitmanager
          port: 8080
    - kind: Rule
      match: Host(`projectmanager.test.company-k8s.local`)
      services:
        - name: projectmanager
          port: 8080
    - kind: Rule
      match: Host(`userprofile.test.company-k8s.local`)
      services:
        - name: userprofile
          port: 8080
    - kind: Rule
      match: Host(`emailbroker.test.company-k8s.local`)
      services:
        - name: emailbroker
          port: 8080
    - kind: Rule
      match: Host(`filegenerator.test.company-k8s.local`)
      services:
        - name: filegenerator
          port: 8080
    - kind: Rule
      match: Host(`collaborativeeditingservice.test.company-k8s.local`)
      services:
        - name: collaborativeeditingservice
          port: 8080
    - kind: Rule
      match: Host(`symbolrecognizer.test.company-k8s.local`)
      services:
        - name: symbolrecognizer
          port: 8000
