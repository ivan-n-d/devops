replicaCount: 1
imagePullPolicy: Always
image:
  repository: docker-registry.example.com/company/emailbroker
  tag: test-499d1128
  name: emailbroker
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  enabled: true
  port: 8080
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  MAIL_CLIENT__HOST: "mail-01.example.com"
  MAIL_CLIENT__PORT: "465"
  MAIL_CLIENT__USE_SSL: "true"
  MAIL_CLIENT__LOGIN: "dev@example.com"
  MAIL_CLIENT__PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  EMAIL__NAME: "Company"
  EMAIL__ADDRESS: "dev@example.com"

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "512Mi"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: emailbroker
