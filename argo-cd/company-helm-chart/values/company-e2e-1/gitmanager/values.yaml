deploymentVersion: "1"
replicaCount: 1
imagePullPolicy: Always
image:
  repository: docker-registry.example.com/company/gitmanager
  tag: develop-a8694b91
  name: gitmanager
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  enabled: true
  port: 8080
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  KESTREL__REQUEST__MAX_BODY_SIZE: "105000000"
  CLIENT__FILE_MANAGER__URI: "http://filemanager:8080"
  CLIENT__FILE_MANAGER__PROJECTS_BUCKET_NAME: "company-projects-e2e1"
  CLIENT__PROJECT_MANAGER__URI: "http://projectmanager:8080"

resources:
  requests:
    cpu: "150m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1536Mi"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: gitmanager
