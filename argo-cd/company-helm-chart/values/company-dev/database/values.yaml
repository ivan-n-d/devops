skipDefaultResources: true

externalDatabase:
  enabled: true
  host: postgres-01.internal.example
  serviceName: database-postgres

postgresql:
  enabled: false
  image: postgres:15.4
  user: postgres
  sealedSecret: |
    ---
    apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: database-postgres-secret
      namespace: company-dev
    spec:
      encryptedData:
        POSTGRES_DB: REPLACE_WITH_KUBESEAL
        POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL
        POSTGRES_USER: REPLACE_WITH_KUBESEAL
      template:
        metadata:
          name: database-postgres-secret
          namespace: company-dev
  database: postgres
  storageSize: 10Gi
