skipDefaultResources: true

ingressRoute:
  enabled: true
  name: company-preprod-route
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`preprod.company-k8s.local`) && PathPrefix(`/api/swagger`)
      services:
        - name: gateway
          port: 8080
    - kind: Rule
      match: Host(`preprod.company-k8s.local`)
      services:
        - name: frontend-application
          port: 80
    - kind: Rule
      match: Host(`facade.preprod.company-k8s.local`)
      services:
        - name: facade
          port: 8080
    - kind: Rule
      match: Host(`filemanager.preprod.company-k8s.local`)
      services:
        - name: filemanager
          port: 8080
    - kind: Rule
      match: Host(`gitmanager.preprod.company-k8s.local`)
      services:
        - name: gitmanager
          port: 8080
    - kind: Rule
      match: Host(`projectmanager.preprod.company-k8s.local`)
      services:
        - name: projectmanager
          port: 8080
    - kind: Rule
      match: Host(`userprofile.preprod.company-k8s.local`)
      services:
        - name: userprofile
          port: 8080
    - kind: Rule
      match: Host(`emailbroker.preprod.company-k8s.local`)
      services:
        - name: emailbroker
          port: 8080
    - kind: Rule
      match: Host(`filegenerator.preprod.company-k8s.local`)
      services:
        - name: filegenerator
          port: 8080
    - kind: Rule
      match: Host(`collaborativeeditingservice.preprod.company-k8s.local`)
      services:
        - name: collaborativeeditingservice
          port: 8080
    - kind: Rule
      match: Host(`symbolrecognizer.preprod.company-k8s.local`)
      services:
        - name: symbolrecognizer
          port: 8000
