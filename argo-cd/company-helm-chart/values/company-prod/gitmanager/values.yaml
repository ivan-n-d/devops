replicaCount: 1
imagePullPolicy: Always
image:
  repository: docker-registry.example.com/company/gitmanager
  tag: master-3c0d23a1
  name: gitmanager
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  enabled: true
  port: 8080
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  KESTREL__REQUEST__MAX_BODY_SIZE: "105000000"
  CLIENT__FILE_MANAGER__URI: "http://filemanager:8080"
  CLIENT__FILE_MANAGER__PROJECTS_BUCKET_NAME: "company-projects-prod"

resources:
  requests:
    cpu: "300m"
    memory: "1536Mi"
  limits:
    cpu: "2000m"
    memory: "2048Mi"
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 30

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: gitmanager
