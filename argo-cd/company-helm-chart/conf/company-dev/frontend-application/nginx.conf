user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    set_real_ip_from  10.244.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format uptime_log_format '[frontend-app-nginx] [$time_local] [$http_user_agent] [$http_referer] [$http_x_forwarded_for] [$remote_addr] [$request] [$status] [$request_time] [$request_length] [$upstream_response_time] [$upstream_response_length] [$bytes_sent]';

    map $http_user_agent $loggable_ua {
        default 1;
        "~*^Blackbox Exporter/" 0;
        "~*^kube-probe/" 0;
        "~*no logging" 0;
    }

    map "$loggable_ua" $is_loggable {
        "1" 1;
        default 0;
    }

    access_log  /dev/stdout  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_min_length 1000;

    add_header X-nginx "nginx=ok" always;

    include /etc/nginx/conf.d/*.conf;
}
