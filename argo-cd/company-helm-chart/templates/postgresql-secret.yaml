{{- if .Values.postgresql.enabled }}
{{- if .Values.postgresql.sealedSecret }}
{{ .Values.postgresql.sealedSecret }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.user | default "postgres" }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | required "postgresql.password (или postgresql.sealedSecret) is required" }}
  POSTGRES_DB: {{ .Values.postgresql.database | default "appdb" }}
{{- end }}
{{- end }}