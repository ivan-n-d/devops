{{/*
  RBAC для разработчиков.
  Включается в values/<env>/namespace-policy/values.yaml:S
    developerRBAC:
      enabled: true
*/}}
{{- if .Values.developerRBAC.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: {{ .Release.Namespace }}
rules:
  # Логи подов
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # kubectl exec
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Информация о ресурсах
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
  # IngressRoute
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: developer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: developer-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: developer
type: kubernetes.io/service-account-token
{{- end }}
